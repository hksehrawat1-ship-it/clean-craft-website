name: Push to ECR

on:
  push:
    branches:
      - main

env:
  AWS_REGION: ${{ env.AWS_REGION }}
  AWS_ACCOUNT_ID: ${{ env.AWS_ACCOUNT_ID }}
  ECR_REPOSITORY: ${{ env.ECR_REPOSITORY }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    environment: production

    permissions:
      id-token: write   # <-- allow OIDC
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v2
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          external-id: ${{ env.AWS_EXTERNAL_ID }}

      - name: Login to ECR
        uses: aws-actions/amazon-ecr-login@v1

      - name: Set image tag (short SHA)
        id: tag
        run: |
          echo "short_sha=$(echo $GITHUB_SHA | cut -c1-7)" >> $GITHUB_OUTPUT

      - name: Build & push Docker image
        uses: docker/build-push-action@v4
        with:
          context: .
          push: true
          tags: |
            ${{ env.AWS_ACCOUNT_ID }}.dkr.ecr.${{ env.AWS_REGION }}.amazonaws.com/${{ env.ECR_REPOSITORY }}:${{ steps.tag.outputs.short_sha }}