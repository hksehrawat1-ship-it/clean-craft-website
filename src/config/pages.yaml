    defaults:
      title_suffix: " | CleanCraft"
      keywords_base: ["professional cleaning", "garment care", "fabric treatment"]
      image: "https://cleancraft.com/lovable-uploads/cleancraft-full-logo.png"
      
  pages:
    "/":
      in:
        title: "Professional Dry Cleaning & Wet Cleaning Services in India"
        description: "Premium dry cleaning, wet cleaning, and laundry services across India. Expert garment care, stain removal, and fabric preservation with eco-friendly cleaning solutions."
